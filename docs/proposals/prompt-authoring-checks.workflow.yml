# Inactive proposal: copy to .github/workflows/prompt-authoring-checks.yml only after approval.
# Verification revision: exact control-role and error-message queries preserve all four browser scenarios.
name: Focused instruction authoring checks
on:
  push:
    branches: [main]
    paths: [.github/workflows/prompt-authoring-checks.yml]
permissions:
  contents: read
jobs:
  authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: open_evals
          POSTGRES_PASSWORD: authoring_disposable_only
          POSTGRES_DB: open_evals_authoring_test_${{ github.run_id }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U open_evals -d open_evals_authoring_test_${{ github.run_id }}"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      AUTH_MODE: hosted
      AUTH_SECRET: authoring_disposable_session_secret_only
      API_KEY_PEPPER: authoring_disposable_api_pepper_only
      HOSTED_DEMO_API_KEY_SCOPES: prompts:read,prompts:write
      HOSTED_DEMO_WORKSPACE_ID: ws_demo
      DATABASE_URL: postgres://open_evals:authoring_disposable_only@127.0.0.1:5432/open_evals_authoring_test_${{ github.run_id }}
      INSTRUCTION_AUTHORING_TEST_TARGET: local-disposable
      INSTRUCTION_AUTHORING_TEST_DATABASE_URL: postgres://open_evals:authoring_disposable_only@127.0.0.1:5432/open_evals_authoring_test_${{ github.run_id }}
      INSTRUCTION_AUTHORING_TEST_URL: http://127.0.0.1:3217
      INSTRUCTION_AUTHORING_DEMO_URL: http://127.0.0.1:3218
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Record runtime and prepare disposable key
        run: |
          mkdir -p .authoring
          git rev-parse HEAD
          node -p 'JSON.stringify({version:process.version,execPath:process.execPath})'
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { createHmac } from 'node:crypto';
          const hash = createHmac('sha256', process.env.API_KEY_PEPPER).update('oe_instruction_disposable_legacy_only').digest('hex');
          appendFileSync(process.env.GITHUB_ENV, 'HOSTED_DEMO_API_KEY_HASH=' + hash + '\n');
          JS
      - name: Thirty pure protocol checks
        run: node --import ./packages/core/tests/register-authoring-typescript.mjs --test --test-reporter=tap ./packages/core/tests/prompt-authoring.node.mjs | tee .authoring/core.tap
      - name: Install the existing frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply the three unchanged migrations to the disposable database
        run: pnpm db:migrate
      - name: Install the locked Chromium runtime
        run: pnpm --filter @open-evals/web exec playwright install --with-deps chromium
      - name: Start the hosted-mode loopback server
        run: |
          setsid pnpm --filter @open-evals/web dev:e2e > .authoring/hosted-server.log 2>&1 &
          echo "$!" > .authoring/server.pid
          for authoring_attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3217/login; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Twenty-three hosted HTTP and database cases
        run: node --test --test-reporter=tap --test-skip-pattern='hosted deployment flags' apps/web/tests/instruction-authoring.api.mjs | tee .authoring/api-hosted.tap
      - name: Four desktop and narrow Chromium scenarios
        run: pnpm --filter @open-evals/web exec playwright test --config tests/instruction-authoring.browser.config.mjs
      - name: Stop hosted server before reusing the Next dev directory
        run: |
          authoring_pid="$(cat .authoring/server.pid)"
          [[ "$authoring_pid" =~ ^[0-9]+$ ]]
          kill -TERM -- "-$authoring_pid" || true
          for authoring_attempt in $(seq 1 30); do
            if ! kill -0 -- "-$authoring_pid" 2>/dev/null; then rm .authoring/server.pid; exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start hosted-local-demo loopback server
        run: |
          AUTH_MODE=local VERCEL=1 setsid pnpm --filter @open-evals/web exec next dev --port 3218 --hostname 127.0.0.1 > .authoring/demo-server.log 2>&1 &
          echo "$!" > .authoring/server.pid
          for authoring_attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3218/login; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: One hosted-local-demo write-denial case
        run: node --test --test-reporter=tap --test-name-pattern='hosted deployment flags' apps/web/tests/instruction-authoring.api.mjs | tee .authoring/api-demo.tap
      - name: Stop only the owned server process group
        if: always()
        run: |
          if [[ -f .authoring/server.pid ]]; then
            authoring_pid="$(cat .authoring/server.pid)"
            [[ "$authoring_pid" =~ ^[0-9]+$ ]]
            kill -TERM -- "-$authoring_pid" || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: instruction-authoring-checks
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .authoring/*.tap
            .authoring/*-server.log
            apps/web/tests/.authoring-browser-results/
