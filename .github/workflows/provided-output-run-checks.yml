                  'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'checkScope': 'four_browser_cases_only', 'postgresCaseCount': None, 'postgresCaseIds': pg_case_ids,
                  'postgresFixturesEmptyBeforeBuild': pg_fixture_empty, 'unprotectedTrackedDelta': unprotected_delta,
                  'browserCaseCount': 4 if passed else None, 'caseResults': browser_results, 'applicationServers': app_records,
                  'commandCount': len(commands), 'cleanup': cleanup, 'errors': errors,
                  'limits': {'streamBytes': stream_limit, 'browserSeconds': 480,
                      'softWorkSeconds': 840, 'stepMinutes': 18, 'jobMinutes': 20},
                  'proofLimits': ['Four real Chromium journeys only, using one fresh owned PostgreSQL fixture database and one production build. The separate 14 owner-SQL cases and 21 pure cases are not invoked here. Signed HMAC fixtures are not hosted provider, membership/RLS, physical-device or live production acceptance; no model call or paid provider.']}
              try: emit_original('cleanup.json', (evidence / 'cleanup.json').read_bytes(), 32768, final=True)
              except Exception as error:
                  result['status'] = 'failed'; result['errors'].append('cleanup_log_transport_failed:' + type(error).__name__)
                  passed = False
              write('receipt.json', result)
              emit(json.dumps({'receipt': result}) + '\n', final=True)
          sys.exit(0 if passed else 1)
          PY
          python3 "$EVIDENCE/driver.py"
      - name: Retain bounded receipts and original streams
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, official repository commit
        with:
          name: provided-output-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          retention-days: 2
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false
