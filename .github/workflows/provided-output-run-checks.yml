name: Provided-output run checks

on:
  push:
    branches: [qa/open-evals-provided-output-20261109]

permissions:
  contents: read

concurrency:
  group: open-evals-provided-output-20261109
  cancel-in-progress: false

jobs:
  browser:
    if: github.repository == 'alvarovillalbaa/open-evals' && github.event.repository.private == false && github.ref == 'refs/heads/qa/open-evals-provided-output-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROOT_ACCEPTED_SOURCE_SHA: 874f29f118d479367a2e6f75ff603abafe847d31
      ROOT_EXPECTED_PARENT_SHA: 4ba4c862de0447ce291a0dae35b87f8b07c19ea7
      TASK_DB: oe_provided_output_test_${{ github.run_id }}_${{ github.run_attempt }}
      OWNED_PORT: '65432'
    steps:
      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          provided_output_evidence="$RUNNER_TEMP/open-evals-provided-output-browser-evidence"
          provided_output_tool_root="$RUNNER_TEMP/open-evals-provided-output-tools"
          test ! -e "$provided_output_evidence"
          mkdir -m 700 "$provided_output_evidence"
          printf 'EVIDENCE=%s\nTOOL_ROOT=%s\n' "$provided_output_evidence" "$provided_output_tool_root" >> "$GITHUB_ENV"
          printf '%s\n' 'Verification has not started; action or runner failures may prevent further receipts.' > "$provided_output_evidence/startup.txt"
      - name: Checkout immutable push source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, official repository commit
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Node 24.22.2
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, official repository commit
        with:
          node-version: 24.22.2
          check-latest: false
          package-manager-cache: false
      - name: Build once, then run four browser journeys
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          umask 077
          cat > "$EVIDENCE/driver.py" <<'PY'
          import base64, hashlib, json, os, pathlib, re, selectors, shutil, signal, socket, stat, subprocess, sys, time
          from datetime import datetime, timezone

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          evidence = pathlib.Path(os.environ['EVIDENCE'])
          tools = pathlib.Path(os.environ['TOOL_ROOT'])
          accepted = os.environ['ROOT_ACCEPTED_SOURCE_SHA']
          expected_parent = os.environ['ROOT_EXPECTED_PARENT_SHA']
          database = os.environ['TASK_DB']
          port = int(os.environ['OWNED_PORT'])
          pg_bin = pathlib.Path('/usr/lib/postgresql/16/bin')
          cluster = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / ('open-evals-provided-output-cluster-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          data_dir, socket_dir = cluster / 'data', cluster / 'socket'
          cluster_ownership, server = None, None
          marker = 'open-evals-provided-output-20261109-created-disposable-v1'
          stream_limit = 4 * 1024 * 1024
          commands, errors = [], []
          created, database_attempted = False, False
          app, app_records, browser_results = None, [], []
          base_url = 'http://127.0.0.1:4173'
          auth_secret = 'authored_open_evals_provided_output_20261109_fixture_only'
          api_key_pepper = 'authored_provided_output_browser_pepper_20261109_fixture_only'
          source_contract_frozen = True  # Source-only draft; root must bind the reviewed final source manifest.
          expected_sources = {
              'apps/web/app/(product)/evals/page.tsx': {'bytes': 9264, 'sha256': '3c3cc282bbb136a22b25568879a01528f444f179c9bc707728a87fbe5d46d585'},
              'apps/web/app/(product)/evals/run/[runId]/page.tsx': {'bytes': 7829, 'sha256': 'fdcd8e2b1dbcf2726ce963d80959e0979b6d7912826ec922324914335bac41dd'},
              'apps/web/app/(product)/evals/run/error.tsx': {'bytes': 709, 'sha256': '73c556bf0b012b84a2b43b6d407ec1fc722a1a04e7b49dbb601734b65f3bb9a0'},
              'apps/web/app/(product)/evals/run/loading.tsx': {'bytes': 372, 'sha256': '592e98d5885469439134b646750f93e7373607447bd895270bfd8acd5979a6da'},
              'apps/web/app/(product)/evals/run/page.tsx': {'bytes': 1306, 'sha256': 'd0c5d95857c2b72042ac408b6a263156a2e7e56a16504b9bf67b848390bd7883'},
              'apps/web/app/(product)/evals/run/provided-output-composer.tsx': {'bytes': 25570, 'sha256': '8c621f33e270d5fa4f9423bca77ba3b4f864c7d58a8556febdf4644329f40884'},
              'apps/web/app/(product)/runs/page.tsx': {'bytes': 4227, 'sha256': '5c77e6401777866f7177f2baa1821a5223a15d8a34a784bba91f705503098f7c'},
              'apps/web/app/api/v1/provided-output-runs/[runId]/route.ts': {'bytes': 643, 'sha256': 'afa9b0bda2a2295165a078217cb8c500bc88d31b50a516f72c991bb4a8c9e33c'},
              'apps/web/app/api/v1/provided-output-runs/preview/route.ts': {'bytes': 542, 'sha256': 'b56465ee79233b86aadcb13fda9ec000bbe112ec90df073a5d17ba39c1594964'},
              'apps/web/app/api/v1/provided-output-runs/route.ts': {'bytes': 844, 'sha256': '5df2c398fde099e6cf139fbefff537d1d38391fb85c3146d2164e7eb1a3d146f'},
              'apps/web/app/api/v1/provided-output-runs/sources/route.ts': {'bytes': 468, 'sha256': '3f0777ad67a3b7b90671883ffbe180ac1214146b8fd3938ffee4c2bb74a6faaa'},
              'apps/web/lib/auth.ts': {'bytes': 7872, 'sha256': '32f35257f9dbe65cd5e40f9c5c6981ff27a54ef0dee955919a49e8bd88ed82e0'},
              'apps/web/lib/custom-eval-access.ts': {'bytes': 709, 'sha256': 'b1a23a32a9052bf681736f723500fa816514bb83a7bee2c7f7afcb6216cf4473'},
              'apps/web/lib/custom-evals.ts': {'bytes': 5461, 'sha256': '62b6610091b35da0567bdb179e6e85267062057f5040fc1cf54fd1c09f47b384'},
              'apps/web/lib/provided-output-runs.ts': {'bytes': 6550, 'sha256': 'b10a42462cb29dc68637eb2d07f71e28bdb18b4694129942069dc12655d3e6ed'},
              'apps/web/lib/provided-output-types.ts': {'bytes': 895, 'sha256': 'fc01e8d6d827e94f86d28deb1e091a851f9cb7736997225e88823521747e939a'},
              'apps/web/package.json': {'bytes': 1207, 'sha256': '8bf8eb6f8d4cb25279b80be1bc8cf088cbaa789409ace2f408b18c49f671e2c5'},
              'docs/proposals/provided-output-runs.md': {'bytes': 5568, 'sha256': '3c75ab8f863bd17e42eb6332cdc19378c8056a1ff4d3f9887d9b5e8ee3c0aebf'},
              'docs/provided-output-runs.md': {'bytes': 3095, 'sha256': 'ee928373f77b6eb36f69cc8fdbbcfbce59508e313544cfca6dc5d84871144621'},
              'package.json': {'bytes': 2248, 'sha256': '1a10d0138fae69c7c297c80456d93d0824ed6c85b8f7f161ce5c75d6f5c8651e'},
              'packages/core/src/custom-evals.ts': {'bytes': 8855, 'sha256': '20276d52b66ef0e1fca0efa85b0d10ea8bde3b3d5854cd160664d40628e5886d'},
              'packages/core/src/eval-engine.ts': {'bytes': 10877, 'sha256': '847d2e79dcb767acece965ab25cbed1acc38cbebabc95372d273f694669c28d3'},
              'packages/core/src/hash.ts': {'bytes': 969, 'sha256': '14c6a74e885a8bbc11b71a80bf4b4e306d4c6feb1868eafe59684eaeee3c7ab0'},
              'packages/core/src/index.ts': {'bytes': 541, 'sha256': 'b46e22ff6f1a65c345f9221bd891b720c5bedf94b68f2de083a1c46d5701c81d'},
              'packages/core/src/provided-output-runs.ts': {'bytes': 23809, 'sha256': '1d4268df1886158630c19b7cbc040118cef4ee32b42bc60e2438c7dd2efdf38d'},
              'packages/core/src/provided-output-types.ts': {'bytes': 3455, 'sha256': '99b88738f66152d279ba1b7d540c7556cba26fbf779ff8982dcaf0ae61ffe18d'},
              'packages/core/src/types.ts': {'bytes': 9194, 'sha256': 'f033bfd60b1883dd8efd35768deb380cf92186df69089ffc29ad991ca97ac25f'},
              'packages/db/migrations/0001_init.sql': {'bytes': 14836, 'sha256': '5472b6946bec22c5cd56b6e671a2ae38503882e37ca8b3bea1b7ac0b7128043d'},
              'packages/db/migrations/0002_hosted_integrations.sql': {'bytes': 4066, 'sha256': '0ab45c7cb5f653a094204e42c1d08725bfa26717ccef5581c90dd61f434cff5e'},
              'packages/db/src/custom-evals.ts': {'bytes': 26003, 'sha256': '77045e8c69107d636c63fc72ae287bc273d62739dfbe038ff6419c4d8d224e9f'},
              'packages/db/src/index.ts': {'bytes': 356, 'sha256': 'd188f0e470b05d99cbb4ddc1b48120075776e3a1f31a2a05135f7b47112ae20f'},
              'packages/db/src/provided-output-runs.ts': {'bytes': 31775, 'sha256': 'fe78426645ceefe3ed29e8b9e08d0d29cc57371d77c65a5cb9b73c8f7f5481f4'},
              'packages/db/src/schema.ts': {'bytes': 15945, 'sha256': '31a7e68d6fd8630e30fa56ae37eb5d1e54d1f560aff57e5b2e5f6d92c1b58442'},
              'packages/db/src/service.ts': {'bytes': 39170, 'sha256': 'ddf1127c1b8b98dd09404d60beeb857775755c3d07e5b75fb233067447d28272'},
              'pnpm-lock.yaml': {'bytes': 214155, 'sha256': '77443b49cd42f85638d82f00bd0e9c510f3662cac777ee0082ffb103775702ea'},
              'tests/e2e/provided-output-runs.browser.config.ts': {'bytes': 1547, 'sha256': '9c584ba011768bcd31beaa2ffb3fc8c27b61205864bd202f4597dce68271ba0d'},
              'tests/e2e/provided-output-runs.browser.fixture.ts': {'bytes': 17622, 'sha256': '16455b8ede3debd1b8e2dfaaea7103e92bd6fbd8437b7fdcfbe49b3a15bab6f4'},
              'tests/e2e/provided-output-runs.browser.spec.ts': {'bytes': 17756, 'sha256': '59d51ef19a3ff50e2a0332f3ab5c1213b71b2723b73eb05f978b837b050bd08c'},
              'tests/integration/provided-output-runs.node.mjs': {'bytes': 35854, 'sha256': '5a72d416c6626ed49975e841292f7baf7956d83622b78e8bc7b2eb2d77584482'},
              'tests/unit/provided-output-runs.test.mjs': {'bytes': 22730, 'sha256': '0825a64cd62a32ec345cbec229ee2f88b68a486780eda37c391be42f188e28a4'},
              'turbo.json': {'bytes': 341, 'sha256': '7caba17ef6c5a0da4f8090ec9a36e16cc243d7c6aa28cc051e2da39a7a5cf6c7'},
          }
          pg_case_ids = []
          pg_fixture_empty = None
          unprotected_delta = None
          log_bytes = 0
          work_deadline = time.monotonic() + 14 * 60
          cleanup_phase = False
          cleanup = {'status': 'not_created', 'databaseAbsent': None, 'clusterStopped': None, 'clusterAbsent': None}
          safe = {key: os.environ[key] for key in ['PATH', 'HOME', 'RUNNER_TEMP'] if key in os.environ}
          safe.update({'CI': 'true', 'TMPDIR': os.environ['RUNNER_TEMP'], 'NO_COLOR': '1'})
          pg = {'PGHOST': '127.0.0.1', 'PGPORT': str(port), 'PGUSER': 'postgres',
                'PGPASSWORD': 'authored_ephemeral_pg_fixture', 'PGDATABASE': 'postgres', 'PGCONNECT_TIMEOUT': '5',
                'PGOPTIONS': '-c statement_timeout=10000 -c lock_timeout=7000'}

          def interrupt_work(number, frame):
              errors.append('interrupted_signal_' + str(number))
              if not cleanup_phase: raise InterruptedError('verification interrupted')

          signal.signal(signal.SIGINT, interrupt_work)
          signal.signal(signal.SIGTERM, interrupt_work)

          def remaining_work(seconds):
              if cleanup_phase: return seconds
              remaining = work_deadline - time.monotonic()
              if remaining <= 0: raise TimeoutError('soft_work_deadline')
              return min(seconds, remaining)

          def write(name, value):
              path = evidence / name
              with path.open('x', encoding='utf-8') as handle:
                  json.dump(value, handle, indent=2); handle.write('\n')

          def port_is_free():
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as probe:
                  probe.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  probe.bind(('127.0.0.1', port))

          def server_identity():
              pid_path = data_dir / 'postmaster.pid'
              meta = pid_path.lstat()
              assert stat.S_ISREG(meta.st_mode) and meta.st_uid == os.getuid() and meta.st_size <= 4096
              lines = pid_path.read_text().splitlines()
              pid = int(lines[0])
              assert pid > 1 and pathlib.Path(lines[1]).resolve() == data_dir and int(lines[3]) == port
              assert pathlib.Path(lines[4]).resolve() == socket_dir and lines[5] == '127.0.0.1'
              proc = pathlib.Path('/proc') / str(pid)
              status = (proc / 'status').read_text()
              assert re.search(r'^Uid:\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s*$', status, re.M)
              executable = (proc / 'exe').resolve()
              assert executable == (pg_bin / 'postgres').resolve()
              argv = (proc / 'cmdline').read_bytes().split(b'\0')
              assert b'-D' in argv and argv[argv.index(b'-D') + 1].decode() == str(data_dir)
              process_stat = (proc / 'stat').read_text()
              start_ticks = process_stat[process_stat.rfind(')') + 2:].split()[19]
              assert start_ticks.isdigit()
              return {'pid': pid, 'startTicks': start_ticks, 'uid': os.getuid(), 'executable': str(executable),
                      'dataDirectory': str(data_dir), 'socketDirectory': str(socket_dir), 'port': port, 'postmasterStartedAt': lines[2]}

          def remove_owned_cluster():
              assert cluster_ownership is not None
              meta = cluster.lstat()
              assert stat.S_ISDIR(meta.st_mode) and (meta.st_dev, meta.st_ino, meta.st_uid) == tuple(cluster_ownership['identity'])
              assert json.loads((cluster / 'owner.json').read_text()) == cluster_ownership
              count, size = 0, 0
              for parent, directories, files in os.walk(cluster, followlinks=False):
                  for name in directories + files:
                      entry = (pathlib.Path(parent) / name).lstat()
                      assert entry.st_uid == os.getuid() and entry.st_dev == meta.st_dev
                      assert stat.S_ISREG(entry.st_mode) or stat.S_ISDIR(entry.st_mode)
                      if stat.S_ISREG(entry.st_mode): assert entry.st_nlink == 1
                      count += 1; size += entry.st_size if stat.S_ISREG(entry.st_mode) else 0
                      assert count <= 5000 and size <= 256 * 1024 * 1024
              shutil.rmtree(cluster)
              assert not cluster.exists()
              return {'entries': count, 'fileBytes': size, 'rootIdentity': cluster_ownership['identity']}

          def emit(text, final=False):
              global log_bytes
              value = text.encode('utf-8')
              assert log_bytes + len(value) <= (256 if final else 224) * 1024, 'joblog_budget_exceeded'
              sys.stdout.buffer.write(value); sys.stdout.buffer.flush()
              log_bytes += len(value)

          def emit_original(name, value, maximum, final=False):
              assert len(value) <= maximum, name + '_print_limit'
              text = value.decode('utf-8')
              tag = re.sub('[^A-Z0-9]', '_', name.upper())
              chunks = '\n'.join('ORIGINAL_CHUNK ' + name + ' ' + str(offset) + ' ' +
                  base64.b64encode(value[offset:offset + 8192]).decode('ascii') for offset in range(0, len(value), 8192))
              metadata = json.dumps({'original': {'file': name, 'bytes': len(value), 'sha256': hashlib.sha256(value).hexdigest()}}) + '\n'
              encoded = 'BEGIN_' + tag + '_BASE64\n' + chunks + '\nEND_' + tag + '_BASE64\n'
              readable = 'BEGIN_' + tag + '\n' + text + '\nEND_' + tag + '\n'
              frame = metadata + readable + encoded
              if log_bytes + len(frame.encode('utf-8')) > (256 if final else 224) * 1024:
                  frame = metadata + encoded
              emit(frame, final=final)

          def emit_failure_diagnostics(label, paths, streams):
              # Diagnostic ranges are labelled; complete bounded originals remain in the artifact.
              for channel, path in paths.items():
                  value = path.read_bytes()
                  offset = max(0, len(value) - 4096)
                  diagnostic = value[offset:]
                  frame = json.dumps({'commandDiagnostic': {'label': label, 'channel': channel,
                      'file': path.name, 'kind': 'full' if offset == 0 else 'tail',
                      'sourceBytes': len(value), 'sourceSha256': hashlib.sha256(value).hexdigest(),
                      'sourceStreamComplete': streams[channel]['complete'], 'offset': offset,
                      'bytes': len(diagnostic), 'sha256': hashlib.sha256(diagnostic).hexdigest(),
                      'base64': base64.b64encode(diagnostic).decode('ascii')}}) + '\n'
                  if log_bytes + len(frame.encode('utf-8')) <= 224 * 1024:
                      emit(frame)

          def run(label, argv, seconds=60, extra=None, show=False):
              seconds = remaining_work(seconds)
              started = datetime.now(timezone.utc).isoformat()
              paths = {key: evidence / f'{label}.{key}.txt' for key in ['stdout', 'stderr']}
              handles = {key: path.open('xb') for key, path in paths.items()}
              sizes = {key: 0 for key in paths}
              complete = {key: False for key in paths}
              reason, proc = None, None
              try:
                  proc = subprocess.Popen(argv, cwd=root, env={**safe, **(extra or {})}, stdin=subprocess.DEVNULL,
                                          stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
                  with selectors.DefaultSelector() as selector:
                      selector.register(proc.stdout, selectors.EVENT_READ, 'stdout')
                      selector.register(proc.stderr, selectors.EVENT_READ, 'stderr')
                      deadline = time.monotonic() + seconds
                      closing = None
                      while selector.get_map():
                          now = time.monotonic()
                          if reason is None and now >= deadline: reason = 'deadline'
                          if reason is not None and closing is None:
                              if proc.poll() is None: os.killpg(proc.pid, signal.SIGKILL)
                              closing = now + 3
                          if closing is not None and now >= closing: break
                          for key, _ in selector.select(.1):
                              data = os.read(key.fileobj.fileno(), 65536)
                              channel = key.data
                              if not data:
                                  complete[channel] = reason is None
                                  selector.unregister(key.fileobj); continue
                              remaining = stream_limit - sizes[channel]
                              handles[channel].write(data[:remaining]); sizes[channel] += min(len(data), remaining)
                              if len(data) > remaining: reason = 'output_limit'
                  try: returncode = proc.wait(timeout=5)
                  except subprocess.TimeoutExpired: returncode, reason = None, 'child_closure_unproved'
              except Exception as error:
                  reason = 'runner_' + type(error).__name__
                  returncode = None if proc is None else proc.poll()
                  if proc is not None and proc.poll() is None:
                      os.killpg(proc.pid, signal.SIGKILL)
                      try: returncode = proc.wait(timeout=5)
                      except subprocess.TimeoutExpired: pass
              finally:
                  for handle in handles.values(): handle.close()
                  if proc is not None:
                      for stream in [proc.stdout, proc.stderr]:
                          if stream is not None: stream.close()
              row = {'label': label, 'argv': argv, 'cwd': str(root), 'environmentKeys': sorted({**safe, **(extra or {})}),
                     'startedAt': started, 'finishedAt': datetime.now(timezone.utc).isoformat(), 'deadlineSeconds': seconds,
                     'returncode': returncode, 'terminationReason': reason, 'streams': {}}
              for channel, path in paths.items():
                  data = path.read_bytes()
                  row['streams'][channel] = {'file': path.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                                             'complete': complete[channel], 'limitBytes': stream_limit}
              commands.append(row)
              emit(json.dumps({'command': {'label': label, 'returncode': returncode, 'terminationReason': reason, 'streams': row['streams']}}) + '\n')
              if show:
                  emit_original(paths['stdout'].name, paths['stdout'].read_bytes(), 65536)
                  emit_original(paths['stderr'].name, paths['stderr'].read_bytes(), 32768)
              if returncode != 0 or reason or not all(complete.values()):
                  if not show: emit_failure_diagnostics(label, paths, row['streams'])
                  raise RuntimeError(label + '_failed')
              return paths['stdout'].read_text(encoding='utf-8')

          def node_identity(pid):
              proc = pathlib.Path('/proc', str(pid))
              status = (proc / 'status').read_text()
              assert re.search(r'^Uid:\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s*$', status, re.M)
              process_stat = (proc / 'stat').read_text()
              fields = process_stat[process_stat.rfind(')') + 2:].split()
              assert int(fields[2]) == pid, 'application must retain its own process group'
              executable = (proc / 'exe').resolve()
              assert executable == pathlib.Path(shutil.which('node', path=safe['PATH'])).resolve()
              return {'pid': pid, 'startTicks': fields[19], 'uid': os.getuid(), 'pgid': int(fields[2]), 'executable': str(executable)}

          def app_port_free():
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as probe:
                  probe.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  probe.bind(('127.0.0.1', 4173))

          def start_app(label):
              global app
              assert app is None
              app_port_free()
              paths = {channel: cluster / (label + '.server.' + channel + '.txt') for channel in ['stdout', 'stderr']}
              handles = {channel: path.open('xb') for channel, path in paths.items()}
              argv = ['node', str(root / 'apps/web/node_modules/next/dist/bin/next'), 'start', '--hostname', '127.0.0.1', '--port', '4173']
              environment = {**safe, 'NODE_ENV': 'production', 'AUTH_MODE': 'hosted', 'AUTH_SECRET': auth_secret,
                  'DATABASE_URL': database_url, 'API_KEY_PEPPER': api_key_pepper, 'NEXT_TELEMETRY_DISABLED': '1'}
              try:
                  process = subprocess.Popen(argv, cwd=root / 'apps/web', env=environment, stdin=subprocess.DEVNULL,
                      stdout=handles['stdout'], stderr=handles['stderr'], start_new_session=True)
              except Exception:
                  for handle in handles.values(): handle.close()
                  raise
              app = {'label': label, 'process': process, 'paths': paths, 'handles': handles, 'identity': None, 'argv': argv}
              for attempt in range(100):
                  remaining_work(1)
                  assert process.poll() is None, label + '_server_exited_before_ready'
                  try:
                      identity = node_identity(process.pid)
                      app['identity'] = identity
                      break
                  except (AssertionError, FileNotFoundError): time.sleep(.05)
              assert app['identity'] is not None, 'application identity unproved'
              for attempt in range(240):
                  remaining_work(1)
                  assert process.poll() is None, label + '_server_exited_before_ready'
                  try:
                      with socket.create_connection(('127.0.0.1', 4173), timeout=.2): return
                  except OSError: time.sleep(.2)
