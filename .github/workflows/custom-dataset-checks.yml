              value = (root / 'apps/web/.next/prerender-manifest.json').read_bytes()
              assert len(value) <= 1048576
              parsed = json.loads(value)
              observed = [route for route in ['/evals/datasets', '/evals/run'] if route in parsed['routes']]
              with (evidence / 'candidate-prerender.json').open('xb') as handle: handle.write(value)
              write('candidate-rendering.json', {'sessionScopedRoutesPrerendered': observed,
                  'bytes': len(value), 'sha256': hashlib.sha256(value).hexdigest()})
              assert not observed, 'session-scoped dataset/scoring pages must be rendered per request'

          def cleanup_attachment(value):
              assert value['contentType'] == 'application/json'
              if 'body' in value:
                  payload = base64.b64decode(value['body'], validate=True)
              else:
                  path = pathlib.Path(value['path'])
                  meta = path.lstat()
                  assert stat.S_ISREG(meta.st_mode) and meta.st_uid == os.getuid() and meta.st_size <= 16384
                  path = path.resolve()
                  assert path.is_relative_to(evidence / 'browser-output')
                  payload = path.read_bytes()
              assert len(payload) <= 16384
              return {'bytes': len(payload), 'sha256': hashlib.sha256(payload).hexdigest(), 'value': json.loads(payload)}

