name: Custom dataset checks

on:
  push:
    branches: [qa/open-evals-custom-datasets-20261109]

permissions:
  contents: read

concurrency:
  group: open-evals-custom-datasets-20261109
  cancel-in-progress: false

jobs:
  browser:
    if: github.repository == 'alvarovillalbaa/open-evals' && github.event.repository.private == false && github.ref == 'refs/heads/qa/open-evals-custom-datasets-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROOT_ACCEPTED_SOURCE_SHA: 39f217a2f146991f7ed811b083126223825c6f7a
      ROOT_EXPECTED_PARENT_SHA: 39f217a2f146991f7ed811b083126223825c6f7a
      TASK_DB: oe_custom_datasets_test_${{ github.run_id }}_${{ github.run_attempt }}
      OWNED_PORT: '65432'
    steps:
      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          custom_dataset_evidence="$RUNNER_TEMP/open-evals-custom-datasets-browser-evidence"
          custom_dataset_tool_root="$RUNNER_TEMP/open-evals-custom-datasets-tools"
          test ! -e "$custom_dataset_evidence"
          mkdir -m 700 "$custom_dataset_evidence"
          printf 'EVIDENCE=%s\nTOOL_ROOT=%s\n' "$custom_dataset_evidence" "$custom_dataset_tool_root" >> "$GITHUB_ENV"
          printf '%s\n' 'Verification has not started; action or runner failures may prevent further receipts.' > "$custom_dataset_evidence/startup.txt"
      - name: Checkout immutable push source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, official repository commit
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Node 24.22.2
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, official repository commit
        with:
          node-version: 24.22.2
          check-latest: false
          package-manager-cache: false
