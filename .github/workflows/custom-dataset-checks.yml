                      cleanup = {'status': 'not_created', 'databaseAbsent': True}
                  else:
                      cleanup = {'status': 'not_created', 'databaseAbsent': None}
              except Exception as error:
                  cleanup = {'status': 'unproved', 'database': database, 'databaseAbsent': None, 'error': type(error).__name__ + ':' + str(error)}
                  errors.append('cleanup_unproved')
              try:
                  if cluster_ownership is not None:
                      if server is not None:
                          assert server_identity() == server, 'server identity changed before stop'
                          run('cluster-stop', [str(pg_bin / 'pg_ctl'), '-D', str(data_dir), '-m', 'smart', '-w', '-t', '30', 'stop'])
                          for attempt in range(50):
                              if not pathlib.Path('/proc', str(server['pid'])).exists(): break
                              time.sleep(.1)
                          assert not pathlib.Path('/proc', str(server['pid'])).exists(), 'server PID absence unproved'
                      assert not (data_dir / 'postmaster.pid').exists(), 'postmaster PID file remains'
                      port_is_free()
                      cleanup['clusterStopped'] = True
                      log = cluster / 'postgres-server.log'
                      if log.exists():
                          fd = os.open(log, os.O_RDONLY | os.O_NOFOLLOW)
                          try:
                              before = os.fstat(fd)
                              assert stat.S_ISREG(before.st_mode) and before.st_uid == os.getuid() and before.st_size <= stream_limit
                              content = b''
                              while len(content) <= stream_limit:
                                  chunk = os.read(fd, 65536)
                                  if not chunk: break
                                  content += chunk
                              after = os.fstat(fd)
                              assert len(content) == before.st_size
                              for key in ['st_dev', 'st_ino', 'st_mode', 'st_uid', 'st_nlink', 'st_size', 'st_mtime_ns', 'st_ctime_ns']:
                                  assert getattr(after, key) == getattr(before, key), 'server log changed during capture'
                              with (evidence / 'postgres-server.log').open('xb') as handle: handle.write(content)
                              cleanup['serverLog'] = {'file': 'postgres-server.log', 'bytes': len(content), 'sha256': hashlib.sha256(content).hexdigest(), 'complete': True}
                          finally: os.close(fd)
                      assert not database_attempted or cleanup.get('databaseAbsent') is True, 'unproved database teardown; cluster data retained'
                      cleanup['removedCluster'] = remove_owned_cluster()
                      cleanup['clusterAbsent'] = True
                      if cleanup.get('databaseAbsent') is True: cleanup['status'] = 'removed'
                  else:
                      cleanup['clusterStopped'], cleanup['clusterAbsent'] = None, None
              except Exception as error:
                  cleanup['clusterStopped'] = cleanup.get('clusterStopped')
                  cleanup['clusterAbsent'] = False
                  cleanup['clusterError'] = type(error).__name__ + ':' + str(error)
                  errors.append('cluster_cleanup_unproved')
              try:
                  for row in source if 'source' in locals() else []:
                      assert capture_source(row['path']) == row, 'protected source changed'
                  if 'head' in locals():
                      run('source-final', ['git', 'diff', '--exit-code', 'HEAD', '--', *protected])
                      names = run('unprotected-tracked-names', ['git', 'diff', '--name-status', '-z', '--no-renames', 'HEAD']).split('\0')
                      assert names[-1] == '' and (len(names) - 1) % 2 == 0
                      changed = [{'status': names[index], 'path': names[index + 1]} for index in range(0, len(names) - 1, 2)]
                      assert all(row['path'] not in protected for row in changed), 'protected tracked path changed'
                      write('unprotected-tracked-delta.json', {'scope': 'outside_the_' + str(len(protected)) + '_protected_paths', 'changes': changed,
                          'protectedChecksPassed': True, 'classification': 'observed names only; not an application-source verification'})
                      delta_bytes = (evidence / 'unprotected-tracked-delta.json').read_bytes()
                      unprotected_delta = {'file': 'unprotected-tracked-delta.json', 'changeCount': len(changed),
                          'bytes': len(delta_bytes), 'sha256': hashlib.sha256(delta_bytes).hexdigest()}
                      if len(delta_bytes) <= 16384 and log_bytes + 3 * len(delta_bytes) + 2048 <= 224 * 1024:
                          emit_original('unprotected-tracked-delta.json', delta_bytes, 16384)
              except Exception as error: errors.append('protected_source_changed:' + type(error).__name__)
              write('cleanup.json', cleanup)
              write('commands.json', commands)
              passed = not errors and (evidence / 'cases.json').exists() and cleanup['databaseAbsent'] is True and cleanup.get('clusterStopped') is True and cleanup.get('clusterAbsent') is True
              result = {'schemaVersion': 'custom-dataset-checks-v1', 'status': 'passed' if passed else 'failed',
                  'acceptedSource': accepted, 'expectedParent': expected_parent, 'directParentSource': expected_parent,
                  'verificationSource': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                  'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'checkScope': 'build_and_five_browser_cases_only',
                  'sqlSuitesInvoked': False, 'priorSqlProof': prior_sql_proof,
                  'customDatasetPostgresCaseCount': None, 'customDatasetPostgresCaseIds': [],
                  'providedOutputRegressionCaseCount': None, 'providedOutputRegressionCaseIds': [], 'pureCoreCasesInvoked': False,
                  'postgresFixturesEmptyBeforeBuild': pg_fixture_empty, 'unprotectedTrackedDelta': unprotected_delta,
                  'browserCaseCount': 5 if passed else None, 'caseResults': browser_results, 'applicationServers': app_records,
                  'commandCount': len(commands), 'cleanup': cleanup, 'errors': errors,
                  'limits': {'streamBytes': stream_limit, 'browserSeconds': 480,
                      'softWorkSeconds': 840, 'stepMinutes': 18, 'jobMinutes': 20},
                  'proofLimits': ['This follow-up invokes one production build and five pending Chromium journeys against a fresh migrated owned database only. It invokes no SQL suite; priorSqlProof identifies the separate R1 source/run with twenty new and fourteen regression SQL passes. Signed HMAC fixtures are not hosted provider, membership/RLS, physical-device or live production acceptance. The thirty pure cases and old four browser cases are not invoked; no model call or paid provider.']}
              try: emit_original('cleanup.json', (evidence / 'cleanup.json').read_bytes(), 32768, final=True)
              except Exception as error:
                  result['status'] = 'failed'; result['errors'].append('cleanup_log_transport_failed:' + type(error).__name__)
                  passed = False
              write('receipt.json', result)
              emit(json.dumps({'receipt': result}) + '\n', final=True)
          sys.exit(0 if passed else 1)
          PY
          python3 "$EVIDENCE/driver.py"
      - name: Retain bounded receipts and original streams
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, official repository commit
        with:
          name: custom-dataset-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          retention-days: 2
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false
