name: Evaluator composition checks

on:
  push:
    branches: [qa/open-evals-composition-v2-20261109]

permissions:
  contents: read

concurrency:
  group: open-evals-composition-v2-20261109
  cancel-in-progress: false

jobs:
  focused:
    if: github.repository == 'alvarovillalbaa/open-evals' && github.event.repository.private == false && github.ref == 'refs/heads/qa/open-evals-composition-v2-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROOT_ACCEPTED_SOURCE_SHA: 894025656a7d264b3b2d573c90e67c40aba57fcf
      ROOT_EXPECTED_PARENT_SHA: 894025656a7d264b3b2d573c90e67c40aba57fcf
      ROOT_EXPECTED_PARENT_TREE_SHA: 9794779b04cae8a9a8490e8854d71dd0f25293ce
      TASK_DB: oe_composition_v2_test_${{ github.run_id }}_${{ github.run_attempt }}
      OWNED_PORT: '65432'
    steps:
      - name: Prepare bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          composition_evidence="$RUNNER_TEMP/open-evals-composition-v2-evidence"
          composition_tools="$RUNNER_TEMP/open-evals-composition-v2-tools"
          test ! -e "$composition_evidence"
          mkdir -m 700 "$composition_evidence"
          printf 'EVIDENCE=%s\nTOOL_ROOT=%s\n' "$composition_evidence" "$composition_tools" >> "$GITHUB_ENV"
          printf '%s\n' 'Verification has not started; runner failures may prevent later receipts.' > "$composition_evidence/startup.txt"
      - name: Checkout immutable push source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, previously reviewed official commit
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Node 24.22.2
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, previously reviewed official commit
        with:
          node-version: 24.22.2
          check-latest: false
          package-manager-cache: false
      - name: Focused source checks, SQL, one build and authored-transport browser journeys
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          umask 077
          cat > "$EVIDENCE/driver.py" <<'PY'
          import base64, hashlib, json, os, pathlib, re, selectors, shutil, signal, socket, stat, subprocess, sys, time
          from datetime import datetime, timezone

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          evidence = pathlib.Path(os.environ['EVIDENCE'])
          tools = pathlib.Path(os.environ['TOOL_ROOT'])
          accepted = os.environ['ROOT_ACCEPTED_SOURCE_SHA']
          expected_parent = os.environ['ROOT_EXPECTED_PARENT_SHA']
          expected_parent_tree = os.environ['ROOT_EXPECTED_PARENT_TREE_SHA']
          database = os.environ['TASK_DB']
          port = int(os.environ['OWNED_PORT'])
          pg_bin = pathlib.Path('/usr/lib/postgresql/16/bin')
          cluster = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / ('open-evals-composition-v2-cluster-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          data_dir, socket_dir = cluster / 'data', cluster / 'socket'
          cluster_ownership, server = None, None
          marker = 'open-evals-composition-v2-20261109-created-disposable-v1'
          stream_limit = 4 * 1024 * 1024
          commands, errors, stage_results = [], [], {}
          created, database_attempted = False, False
          app, app_records, browser_results = None, [], []
          base_url = 'http://127.0.0.1:4173'
          auth_secret = 'authored_open_evals_composition_v2_20261109_fixture_only'
          api_key_pepper = 'authored_composition_v2_browser_pepper_20261109_fixture_only'
          source_contract_frozen = True  # Source maps and authored scope reviewed; standing check authorization recorded.
