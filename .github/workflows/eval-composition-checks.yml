                      assert final_source == source, 'protected source changed'
                  if 'head' in locals():
                      run('source-final', ['git', 'diff', '--exit-code', 'HEAD', '--', *protected])
                      names = run('unprotected-tracked-names', ['git', 'diff', '--name-status', '-z', '--no-renames', 'HEAD']).split('\0')
                      assert names[-1] == '' and (len(names) - 1) % 2 == 0
                      changed = [{'status': names[index], 'path': names[index + 1]} for index in range(0, len(names) - 1, 2)]
                      assert all(row['path'] not in protected for row in changed), 'protected tracked path changed'
                      write('unprotected-tracked-delta.json', {'scope': 'outside_the_' + str(len(protected)) + '_protected_paths', 'changes': changed,
                          'protectedChecksPassed': True, 'classification': 'observed names only; not an application-source verification'})
                      delta_bytes = (evidence / 'unprotected-tracked-delta.json').read_bytes()
                      unprotected_delta = {'file': 'unprotected-tracked-delta.json', 'changeCount': len(changed),
                          'bytes': len(delta_bytes), 'sha256': hashlib.sha256(delta_bytes).hexdigest()}
                      if len(delta_bytes) <= 16384 and log_bytes + 3 * len(delta_bytes) + 2048 <= 480 * 1024:
                          emit_original('unprotected-tracked-delta.json', delta_bytes, 16384)
              except Exception as error: errors.append('protected_source_changed:' + type(error).__name__)
              write('cleanup.json',cleanup)
              write('commands.json',commands)
              passed=not errors and (evidence/'cases.json').exists() and cleanup['databaseAbsent'] is True and cleanup.get('clusterStopped') is True and cleanup.get('clusterAbsent') is True
              result={'schemaVersion':'eval-composition-checks-v1','status':'passed' if passed else 'failed','acceptedSource':accepted,
                  'expectedParent':expected_parent,'verificationSource':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'expectedParentTree':expected_parent_tree,'verificationTree':source_tree if 'source_tree' in locals() else None,
                  'executedStageIds':stage_results,'browserResults':browser_results,'transport':transport_summary,'applicationServers':app_records,'commandCount':len(commands),
                  'postgresFixturesEmptyAfterSql':pg_fixture_empty,'unprotectedTrackedDelta':unprotected_delta,'cleanup':cleanup,'errors':errors,
                  'limits':{'streamBytes':stream_limit,'selectedOriginalLogBytes':524288,'regularLogBytes':491520,'finalLogReserveBytes':32768,'focusedSuiteSeconds':300,'buildSeconds':240,'browserSeconds':420,'softWorkSeconds':840,'stepMinutes':18,'jobMinutes':20},
                  'proofLimits':['The76 core cases repeat the locally passed Node26 packet under pinned Node24; they remain76 distinct cases. Web and SQL cases use authored fixtures. Browser journeys run the compiled production app with a fixture-only native dependency preload, real workspace-session policy and real disposable SQL; only authored transport responses are supplied. No real target, model, provider account, paid service or production data is called. The preload is outside the app dependency graph and is never enabled in production. Native DNS/socket/TLS and hosted auth-provider/RLS or physical-device behavior remain unverified. Stream files are individually bounded and completeness is recorded; no artifact archive retrieval is claimed.']}
              try: emit_original('cleanup.json',(evidence/'cleanup.json').read_bytes(),32768,final=True)
              except Exception as error:
                  result['status']='failed';result['errors'].append('cleanup_log_transport_failed:'+type(error).__name__);passed=False
              try: emit_original('receipt.json',(json.dumps(result,indent=2)+'\n').encode(),65536,final=True)
              except Exception as error:
                  result['status']='failed';result['errors'].append('receipt_log_transport_failed:'+type(error).__name__);passed=False
              write('receipt.json',result)
              originals=[]
              names={'source.json','source-final.json','cases.json','receipt.json','cleanup.json','commands.json','browser-report.json',
                  'postgres-fixture-absence.json','fixture-final-absence.json','core-cases.json','web-cases.json','composition-postgres-cases.json','transport-journal.jsonl','transport-summary.json'}
              completeness={}
              for command in commands:
                  names.update(stream['file'] for stream in command['streams'].values())
                  completeness.update({stream['file']:stream['complete'] for stream in command['streams'].values()})
              for application in app_records:
                  names.update(stream['file'] for stream in application['streams'].values())
                  completeness.update({stream['file']:stream['complete'] for stream in application['streams'].values()})
              for name in sorted(names):
                  path=evidence/name
                  if not path.exists(): continue
                  fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
                  try:
                      before=os.fstat(fd);assert stat.S_ISREG(before.st_mode) and before.st_uid==os.getuid() and before.st_size<=stream_limit
                      value=b''
                      while len(value)<=stream_limit:
                          chunk=os.read(fd,65536)
                          if not chunk: break
                          value+=chunk
                      after=os.fstat(fd);assert len(value)==before.st_size
                      for key in ['st_dev','st_ino','st_mode','st_uid','st_nlink','st_size','st_mtime_ns','st_ctime_ns']: assert getattr(after,key)==getattr(before,key)
                      originals.append({'file':name,'bytes':len(value),'sha256':hashlib.sha256(value).hexdigest(),'complete':completeness.get(name,True)})
                  finally: os.close(fd)
              write('originals.json',{'source':os.environ['GITHUB_SHA'],'files':originals,'artifactZipRetrieved':False})
              emit(json.dumps({'receiptStatus':result['status'],'scope':'core_web_sql_one_build_four_authored_transport_browser'})+'\n',final=True)
          sys.exit(0 if passed else 1)
          PY
          python3 "$EVIDENCE/driver.py"
      - name: Retain bounded receipts and original streams
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, previously reviewed official commit
        with:
          name: eval-composition-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          retention-days: 2
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false
