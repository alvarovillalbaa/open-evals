          def stop_app():
              global app
              if app is None: return
              owned = app
              process, identity = owned['process'], owned['identity']
              assert identity is not None, 'application closure requires the recorded identity'
              mode = 'already_exited'
              if process.poll() is None:
                  assert node_identity(process.pid) == identity, 'application identity changed'
                  owned['shutdownSent'] = True
                  os.killpg(process.pid, signal.SIGTERM)
                  mode = 'graceful'
                  try: returncode = process.wait(timeout=20)
                  except subprocess.TimeoutExpired:
                      assert node_identity(process.pid) == identity
                      os.killpg(process.pid, signal.SIGKILL)
                      returncode = process.wait(timeout=5)
                      mode = 'forced'
                      errors.append('application_required_forced_stop')
              else:
                  returncode = process.wait(timeout=5)
                  if not owned.get('shutdownSent'): errors.append('application_exited_before_shutdown')
              for handle in owned['handles'].values(): handle.close()
              if returncode not in [0, -signal.SIGTERM, -signal.SIGKILL] and not (
                  returncode == 128 + signal.SIGTERM and mode == 'graceful' and owned.get('shutdownSent') is True
