      OWNED_PORT: '65432'
    steps:
      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          http_target_evidence="$RUNNER_TEMP/open-evals-http-target-browser-evidence"
          http_target_tool_root="$RUNNER_TEMP/open-evals-http-target-tools"
          test ! -e "$http_target_evidence"
          mkdir -m 700 "$http_target_evidence"
          printf 'EVIDENCE=%s\nTOOL_ROOT=%s\n' "$http_target_evidence" "$http_target_tool_root" >> "$GITHUB_ENV"
          printf '%s\n' 'Verification has not started; action or runner failures may prevent further receipts.' > "$http_target_evidence/startup.txt"
      - name: Checkout immutable push source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, official repository commit
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Node 24.22.2
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, official repository commit
        with:
          node-version: 24.22.2
          check-latest: false
          package-manager-cache: false
