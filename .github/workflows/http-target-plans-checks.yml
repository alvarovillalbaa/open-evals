                  'verificationSource': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                  'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'checkScope': 'web_tier2_http_sql_regression_build_and_five_no_dispatch_browser_cases',
                  'expectedParentTree': expected_parent_tree, 'verificationTree': source_tree if 'source_tree' in locals() else None,
                  'sqlSuitesInvoked': any(row['label'] in ['http-eval-postgres-cases', 'provided-output-regression-cases'] for row in commands),
                  'httpEvalPostgresCaseCount': len(http_pg_case_ids) if (evidence / 'http-eval-postgres-cases.json').exists() else None,
                  'httpEvalPostgresCaseIds': http_pg_case_ids,
                  'providedOutputRegressionCaseCount': len(regression_case_ids) if (evidence / 'provided-output-regression-cases.json').exists() else None,
                  'providedOutputRegressionCaseIds': regression_case_ids, 'coreNativeTier2Invoked': False,
                  'webTier2Invoked': any(row['label'] == 'web-tier2-cases' for row in commands),
                  'webTier2CaseCount': len(web_case_ids) if (evidence / 'web-tier2-cases.json').exists() else None,
                  'webTier2CaseIds': web_case_ids,
                  'webTier2BootstrapReason': 'Local Node26 removed the required TypeScript transform mode; pinned Node24 supports it.',
                  'actualHttpExecutionChecked': False,
                  'postgresFixturesEmptyBeforeBuild': pg_fixture_empty, 'unprotectedTrackedDelta': unprotected_delta,
                  'browserCaseCount': 5 if passed else None, 'caseResults': browser_results, 'applicationServers': app_records,
                  'commandCount': len(commands), 'cleanup': cleanup, 'errors': errors,
                  'limits': {'streamBytes': stream_limit, 'focusedSuiteSeconds': 300, 'browserSeconds': 480,
                      'softWorkSeconds': 840, 'stepMinutes': 18, 'jobMinutes': 20},
                  'proofLimits': ['Scope:20 Web T2 seams under the compatible Node24 transform bootstrap,31 new HTTP owner-SQL cases,14 provided-output SQL regressions after the shared source-loader change, one production build and five actual-app no-dispatch Chromium journeys. No HTTP target, model, account, paid service or production data is called. Browser journeys do not prove actual execution or native DNS/socket/TLS behavior; separately recorded64 core/native checks are not repeated. Signed HMAC fixtures do not prove hosted auth/membership/RLS or physical-device acceptance.']}
              try: emit_original('cleanup.json', (evidence / 'cleanup.json').read_bytes(), 32768, final=True)
              except Exception as error:
                  result['status'] = 'failed'; result['errors'].append('cleanup_log_transport_failed:' + type(error).__name__)
                  passed = False
              receipt_bytes = (json.dumps(result, indent=2) + '\n').encode('utf-8')
              try: emit_original('receipt.json', receipt_bytes, 65536, final=True)
              except Exception as error:
                  result['status'] = 'failed'; result['errors'].append('receipt_log_transport_failed:' + type(error).__name__)
                  passed = False
              write('receipt.json', result)
              originals = []
              names = {'source.json', 'source-final.json', 'cases.json', 'receipt.json', 'cleanup.json',
                  'commands.json', 'browser-report.json', 'postgres-fixture-absence.json',
                  'http-eval-postgres-cases.json', 'provided-output-regression-cases.json', 'web-tier2-cases.json'}
              stream_completeness = {}
              for command in commands:
                  names.update(stream['file'] for stream in command['streams'].values())
                  stream_completeness.update({stream['file']: stream['complete'] for stream in command['streams'].values()})
              for application in app_records:
                  names.update(stream['file'] for stream in application['streams'].values())
                  stream_completeness.update({stream['file']: stream['complete'] for stream in application['streams'].values()})
              for name in sorted(names):
                  path = evidence / name
                  if not path.exists(): continue
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
                  try:
                      before = os.fstat(fd)
                      assert stat.S_ISREG(before.st_mode) and before.st_uid == os.getuid() and before.st_size <= stream_limit
                      value = b''
                      while len(value) <= stream_limit:
                          chunk = os.read(fd, 65536)
                          if not chunk: break
                          value += chunk
                      after = os.fstat(fd)
                      assert len(value) == before.st_size
                      for key in ['st_dev', 'st_ino', 'st_mode', 'st_uid', 'st_nlink', 'st_size', 'st_mtime_ns', 'st_ctime_ns']:
                          assert getattr(after, key) == getattr(before, key), 'original changed during capture'
                      originals.append({'file': name, 'bytes': len(value), 'sha256': hashlib.sha256(value).hexdigest(),
                          'complete': stream_completeness.get(name, True)})
                  finally: os.close(fd)
              write('originals.json', {'source': os.environ['GITHUB_SHA'], 'files': originals, 'artifactZipRetrieved': False})
              emit(json.dumps({'receiptStatus': result['status'], 'scope': result['checkScope']}) + '\n', final=True)
          sys.exit(0 if passed else 1)
          PY
          python3 "$EVIDENCE/driver.py"
      - name: Retain bounded receipts and original streams
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, official repository commit
        with:
          name: http-target-plans-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          retention-days: 2
          if-no-files-found: error
          compression-level: 6
          overwrite: false
          include-hidden-files: false
