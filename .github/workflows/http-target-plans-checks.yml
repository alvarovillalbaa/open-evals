          pg = {'PGHOST': '127.0.0.1', 'PGPORT': str(port), 'PGUSER': 'postgres',
                'PGPASSWORD': 'authored_ephemeral_pg_fixture', 'PGDATABASE': 'postgres', 'PGCONNECT_TIMEOUT': '5',
                'PGOPTIONS': '-c statement_timeout=10000 -c lock_timeout=7000'}

          def interrupt_work(number, frame):
              errors.append('interrupted_signal_' + str(number))
              if not cleanup_phase: raise InterruptedError('verification interrupted')

          signal.signal(signal.SIGINT, interrupt_work)
          signal.signal(signal.SIGTERM, interrupt_work)

          def remaining_work(seconds):
              if cleanup_phase: return seconds
              remaining = work_deadline - time.monotonic()
              if remaining <= 0: raise TimeoutError('soft_work_deadline')
              return min(seconds, remaining)

          def write(name, value):
              path = evidence / name
              with path.open('x', encoding='utf-8') as handle:
                  json.dump(value, handle, indent=2); handle.write('\n')

          def port_is_free():
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as probe:
                  probe.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  probe.bind(('127.0.0.1', port))

          def server_identity():
              pid_path = data_dir / 'postmaster.pid'
              meta = pid_path.lstat()
              assert stat.S_ISREG(meta.st_mode) and meta.st_uid == os.getuid() and meta.st_size <= 4096
              lines = pid_path.read_text().splitlines()
              pid = int(lines[0])
              assert pid > 1 and pathlib.Path(lines[1]).resolve() == data_dir and int(lines[3]) == port
              assert pathlib.Path(lines[4]).resolve() == socket_dir and lines[5] == '127.0.0.1'
              proc = pathlib.Path('/proc') / str(pid)
              status = (proc / 'status').read_text()
              assert re.search(r'^Uid:\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s*$', status, re.M)
              executable = (proc / 'exe').resolve()
              assert executable == (pg_bin / 'postgres').resolve()
              argv = (proc / 'cmdline').read_bytes().split(b'\0')
              assert b'-D' in argv and argv[argv.index(b'-D') + 1].decode() == str(data_dir)
              process_stat = (proc / 'stat').read_text()
              start_ticks = process_stat[process_stat.rfind(')') + 2:].split()[19]
              assert start_ticks.isdigit()
              return {'pid': pid, 'startTicks': start_ticks, 'uid': os.getuid(), 'executable': str(executable),
                      'dataDirectory': str(data_dir), 'socketDirectory': str(socket_dir), 'port': port, 'postmasterStartedAt': lines[2]}

          def remove_owned_cluster():
              assert cluster_ownership is not None
              meta = cluster.lstat()
              assert stat.S_ISDIR(meta.st_mode) and (meta.st_dev, meta.st_ino, meta.st_uid) == tuple(cluster_ownership['identity'])
              assert json.loads((cluster / 'owner.json').read_text()) == cluster_ownership
              count, size = 0, 0
              for parent, directories, files in os.walk(cluster, followlinks=False):
                  for name in directories + files:
                      entry = (pathlib.Path(parent) / name).lstat()
                      assert entry.st_uid == os.getuid() and entry.st_dev == meta.st_dev
                      assert stat.S_ISREG(entry.st_mode) or stat.S_ISDIR(entry.st_mode)
                      if stat.S_ISREG(entry.st_mode): assert entry.st_nlink == 1
                      count += 1; size += entry.st_size if stat.S_ISREG(entry.st_mode) else 0
                      assert count <= 5000 and size <= 256 * 1024 * 1024
              shutil.rmtree(cluster)
              assert not cluster.exists()
              return {'entries': count, 'fileBytes': size, 'rootIdentity': cluster_ownership['identity']}

          def emit(text, final=False):
              global log_bytes
              value = text.encode('utf-8')
              assert log_bytes + len(value) <= (256 if final else 224) * 1024, 'joblog_budget_exceeded'
              sys.stdout.buffer.write(value); sys.stdout.buffer.flush()
              log_bytes += len(value)

          def emit_original(name, value, maximum, final=False):
              assert len(value) <= maximum, name + '_print_limit'
              value.decode('utf-8')  # Validate text; publish only one base64 representation.
              tag = re.sub('[^A-Z0-9]', '_', name.upper())
              chunks = '\n'.join('ORIGINAL_CHUNK ' + name + ' ' + str(offset) + ' ' +
                  base64.b64encode(value[offset:offset + 8192]).decode('ascii') for offset in range(0, len(value), 8192))
              metadata = json.dumps({'original': {'file': name, 'bytes': len(value), 'sha256': hashlib.sha256(value).hexdigest()}}) + '\n'
              encoded = 'BEGIN_' + tag + '_BASE64\n' + chunks + '\nEND_' + tag + '_BASE64\n'
              emit(metadata + encoded, final=final)

          def emit_failure_diagnostics(label, paths, streams):
              # Diagnostic ranges are labelled; complete bounded originals remain in the artifact.
              for channel, path in paths.items():
                  value = path.read_bytes()
                  offset = max(0, len(value) - 4096)
                  diagnostic = value[offset:]
                  frame = json.dumps({'commandDiagnostic': {'label': label, 'channel': channel,
                      'file': path.name, 'kind': 'full' if offset == 0 else 'tail',
                      'sourceBytes': len(value), 'sourceSha256': hashlib.sha256(value).hexdigest(),
                      'sourceStreamComplete': streams[channel]['complete'], 'offset': offset,
                      'bytes': len(diagnostic), 'sha256': hashlib.sha256(diagnostic).hexdigest(),
                      'base64': base64.b64encode(diagnostic).decode('ascii')}}) + '\n'
                  if log_bytes + len(frame.encode('utf-8')) <= 224 * 1024:
                      emit(frame)

          def run(label, argv, seconds=60, extra=None, show=False):
              seconds = remaining_work(seconds)
              started = datetime.now(timezone.utc).isoformat()
              paths = {key: evidence / f'{label}.{key}.txt' for key in ['stdout', 'stderr']}
              handles = {key: path.open('xb') for key, path in paths.items()}
              sizes = {key: 0 for key in paths}
              complete = {key: False for key in paths}
              reason, proc = None, None
              try:
                  proc = subprocess.Popen(argv, cwd=root, env={**safe, **(extra or {})}, stdin=subprocess.DEVNULL,
                                          stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
                  with selectors.DefaultSelector() as selector:
                      selector.register(proc.stdout, selectors.EVENT_READ, 'stdout')
                      selector.register(proc.stderr, selectors.EVENT_READ, 'stderr')
                      deadline = time.monotonic() + seconds
                      closing = None
                      while selector.get_map():
                          now = time.monotonic()
                          if reason is None and now >= deadline: reason = 'deadline'
                          if reason is not None and closing is None:
                              if proc.poll() is None: os.killpg(proc.pid, signal.SIGKILL)
                              closing = now + 3
                          if closing is not None and now >= closing: break
                          for key, _ in selector.select(.1):
                              data = os.read(key.fileobj.fileno(), 65536)
                              channel = key.data
                              if not data:
                                  complete[channel] = reason is None
                                  selector.unregister(key.fileobj); continue
                              remaining = stream_limit - sizes[channel]
                              handles[channel].write(data[:remaining]); sizes[channel] += min(len(data), remaining)
                              if len(data) > remaining: reason = 'output_limit'
                  try: returncode = proc.wait(timeout=5)
                  except subprocess.TimeoutExpired: returncode, reason = None, 'child_closure_unproved'
              except Exception as error:
                  reason = 'runner_' + type(error).__name__
                  returncode = None if proc is None else proc.poll()
                  if proc is not None and proc.poll() is None:
                      os.killpg(proc.pid, signal.SIGKILL)
                      try: returncode = proc.wait(timeout=5)
                      except subprocess.TimeoutExpired: pass
              finally:
                  for handle in handles.values(): handle.close()
                  if proc is not None:
                      for stream in [proc.stdout, proc.stderr]:
                          if stream is not None: stream.close()
              row = {'label': label, 'argv': argv, 'cwd': str(root), 'environmentKeys': sorted({**safe, **(extra or {})}),
                     'startedAt': started, 'finishedAt': datetime.now(timezone.utc).isoformat(), 'deadlineSeconds': seconds,
                     'returncode': returncode, 'terminationReason': reason, 'streams': {}}
              for channel, path in paths.items():
                  data = path.read_bytes()
                  row['streams'][channel] = {'file': path.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                                             'complete': complete[channel], 'limitBytes': stream_limit}
              commands.append(row)
              emit(json.dumps({'command': {'label': label, 'returncode': returncode, 'terminationReason': reason, 'streams': row['streams']}}) + '\n')
              if show:
                  emit_original(paths['stdout'].name, paths['stdout'].read_bytes(), 65536)
                  emit_original(paths['stderr'].name, paths['stderr'].read_bytes(), 32768)
              if returncode != 0 or reason or not all(complete.values()):
                  if not show: emit_failure_diagnostics(label, paths, row['streams'])
                  raise RuntimeError(label + '_failed')
              return paths['stdout'].read_text(encoding='utf-8')

          def node_identity(pid):
              proc = pathlib.Path('/proc', str(pid))
              status = (proc / 'status').read_text()
              assert re.search(r'^Uid:\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s+' + str(os.getuid()) + r'\s*$', status, re.M)
              process_stat = (proc / 'stat').read_text()
              fields = process_stat[process_stat.rfind(')') + 2:].split()
              assert int(fields[2]) == pid, 'application must retain its own process group'
              executable = (proc / 'exe').resolve()
              assert executable == pathlib.Path(shutil.which('node', path=safe['PATH'])).resolve()
              return {'pid': pid, 'startTicks': fields[19], 'uid': os.getuid(), 'pgid': int(fields[2]), 'executable': str(executable)}

          def focused_cases(label, argv, environment, expected_ids, prefix, tier, actual_postgres=False):
              tap = run(label, argv, 300, environment, True)
              ids = re.findall(r'^\s*ok \d+ - (' + re.escape(prefix) + r'\d{2})\b', tap, re.M)
              assert ids == expected_ids, label + '_exact_case_results_required'
              count = len(expected_ids)
              for total in [f'tests {count}', f'pass {count}', 'fail 0', 'cancelled 0', 'skipped 0', 'todo 0']:
                  assert re.search(r'^# ' + total + r'\s*$', tap, re.M), label + '_TAP_total_missing:' + total
              assert not re.search(r'^\s*(?:not )?ok\b[^\n]*#\s*(?:SKIP|TODO)\b', tap, re.M | re.I)
              write(label + '.json', {'status': 'passed', 'ids': ids, 'tier': tier, 'actualPostgreSQL': actual_postgres,
                  'authProviderChecked': False, 'hostedRlsChecked': False, 'targetCalls': 0})
              return ids

          def app_port_free():
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as probe:
                  probe.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  probe.bind(('127.0.0.1', 4173))

          def start_app(label):
              global app
              assert app is None
              app_port_free()
              paths = {channel: cluster / (label + '.server.' + channel + '.txt') for channel in ['stdout', 'stderr']}
              handles = {channel: path.open('xb') for channel, path in paths.items()}
              argv = ['node', str(root / 'apps/web/node_modules/next/dist/bin/next'), 'start', '--hostname', '127.0.0.1', '--port', '4173']
              environment = {**safe, 'NODE_ENV': 'production', 'AUTH_MODE': 'hosted', 'AUTH_SECRET': auth_secret,
                  'DATABASE_URL': database_url, 'API_KEY_PEPPER': api_key_pepper, 'NEXT_TELEMETRY_DISABLED': '1'}
              try:
                  process = subprocess.Popen(argv, cwd=root / 'apps/web', env=environment, stdin=subprocess.DEVNULL,
                      stdout=handles['stdout'], stderr=handles['stderr'], start_new_session=True)
              except Exception:
                  for handle in handles.values(): handle.close()
                  raise
              app = {'label': label, 'process': process, 'paths': paths, 'handles': handles, 'identity': None, 'argv': argv}
              for attempt in range(100):
                  remaining_work(1)
                  assert process.poll() is None, label + '_server_exited_before_ready'
                  try:
                      identity = node_identity(process.pid)
                      app['identity'] = identity
                      break
                  except (AssertionError, FileNotFoundError): time.sleep(.05)
              assert app['identity'] is not None, 'application identity unproved'
              for attempt in range(240):
                  remaining_work(1)
                  assert process.poll() is None, label + '_server_exited_before_ready'
                  try:
                      with socket.create_connection(('127.0.0.1', 4173), timeout=.2): return
                  except OSError: time.sleep(.2)
              raise RuntimeError(label + '_server_not_ready')

          def stop_app():
              global app
              if app is None: return
              owned = app
              process, identity = owned['process'], owned['identity']
              assert identity is not None, 'application closure requires the recorded identity'
              mode = 'already_exited'
              if process.poll() is None:
                  assert node_identity(process.pid) == identity, 'application identity changed'
                  owned['shutdownSent'] = True
                  os.killpg(process.pid, signal.SIGTERM)
                  mode = 'graceful'
                  try: returncode = process.wait(timeout=20)
                  except subprocess.TimeoutExpired:
                      assert node_identity(process.pid) == identity
                      os.killpg(process.pid, signal.SIGKILL)
                      returncode = process.wait(timeout=5)
                      mode = 'forced'
                      errors.append('application_required_forced_stop')
              else:
                  returncode = process.wait(timeout=5)
                  if not owned.get('shutdownSent'): errors.append('application_exited_before_shutdown')
              for handle in owned['handles'].values(): handle.close()
              if returncode not in [0, -signal.SIGTERM, -signal.SIGKILL] and not (
                  returncode == 128 + signal.SIGTERM and mode == 'graceful' and owned.get('shutdownSent') is True
              ): errors.append('application_exit_' + str(returncode))
              assert not pathlib.Path('/proc', str(process.pid)).exists()
              try: os.killpg(process.pid, 0)
              except ProcessLookupError: pass
              else: raise RuntimeError('application_group_closure_unproved')
              app_port_free()
              record = {'label': owned['label'], 'argv': owned['argv'], 'identity': identity,
                        'returncode': returncode, 'stopMode': mode, 'pidAbsent': True, 'processGroupAbsent': True, 'portFree': True, 'streams': {}}
              for channel, path in owned['paths'].items():
                  meta = path.lstat()
                  assert stat.S_ISREG(meta.st_mode) and meta.st_uid == os.getuid() and meta.st_size <= stream_limit
                  value = path.read_bytes()
                  destination = evidence / path.name
                  with destination.open('xb') as handle: handle.write(value)
                  record['streams'][channel] = {'file': destination.name, 'bytes': len(value),
                      'sha256': hashlib.sha256(value).hexdigest(), 'complete': True}
              app_records.append(record)
              app = None
              write(owned['label'] + '-server.json', record)
              stderr_bytes = (evidence / record['streams']['stderr']['file']).read_bytes()
              if len(stderr_bytes) <= 16384 and log_bytes + 3 * len(stderr_bytes) + 2048 <= 224 * 1024:
                  emit_original(record['streams']['stderr']['file'], stderr_bytes, 16384)

          def capture_source(path):
              target = root / path
              descriptor = os.open(target, os.O_RDONLY | os.O_NOFOLLOW)
              try:
                  before = os.fstat(descriptor)
                  assert stat.S_ISREG(before.st_mode) and before.st_uid == os.getuid() and before.st_size <= 262144
                  value = b''
                  while len(value) <= 262144:
                      chunk = os.read(descriptor, 65536)
                      if not chunk: break
                      value += chunk
                  after = os.fstat(descriptor)
                  assert len(value) == before.st_size
                  for key in ['st_dev', 'st_ino', 'st_mode', 'st_uid', 'st_nlink', 'st_size', 'st_mtime_ns', 'st_ctime_ns']:
                      assert getattr(before, key) == getattr(after, key), 'source changed during capture'
                  return {'path': path, 'bytes': len(value), 'sha256': hashlib.sha256(value).hexdigest()}
              finally: os.close(descriptor)

