[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-evals-sdk"
version = "0.1.0"
description = "Standalone standard-library Python client for Open Evals."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["open_evals_sdk"]
